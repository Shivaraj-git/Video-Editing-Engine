services:
  api:
    build: .
    image: video-editor:latest
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/uploads
      - outputs:/app/outputs
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  ui:
    build: .
    image: video-editor:latest
    command: ["python", "app.py"]
    environment:
      API_BASE_URL: http://api:8000
      UI_HOST: 0.0.0.0
      UI_PORT: "7860"
    ports:
      - "7860:7860"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  uploads:
  outputs:
